name: Release LionClip

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install native and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            appstream \
            build-essential \
            desktop-file-utils \
            dpkg-dev \
            libadwaita-1-dev \
            libglib2.0-bin \
            libgtk-4-dev \
            libx11-dev \
            librsvg2-bin \
            pkg-config \
            xvfb

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check tag matches Cargo version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ -z "$package_version" || "$package_version" != "$tag_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $package_version." >&2
            exit 1
          fi

      - name: Validate application
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features

      - name: Build release binary
        run: cargo build --release --locked

      - name: Validate package metadata
        run: |
          set -euo pipefail
          bash -n packaging/deb/build.sh
          bash -n packaging/icons/render.sh
          bash -n packaging/scripts/lionclip-shortcut
          sh -n packaging/deb/postinst
          sh -n packaging/deb/postrm
          desktop-file-validate packaging/desktop/io.github.Pianisuto.LionClip.desktop
          desktop-file-validate packaging/autostart/io.github.Pianisuto.LionClip.desktop
          appstreamcli validate --no-net packaging/metainfo/io.github.Pianisuto.LionClip.metainfo.xml
          work="$(mktemp -d)"
          cp packaging/schemas/io.github.Pianisuto.LionClip.gschema.xml "$work/"
          glib-compile-schemas --strict "$work"
          rm -rf "$work"

      - name: Build Debian package
        run: SKIP_BUILD=1 packaging/deb/build.sh

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          cp target/deb/lionclip_*_amd64.deb release-files/
          (
            cd release-files
            sha256sum lionclip_*_amd64.deb > SHA256SUMS.txt
          )

      - name: Create draft release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; assets will be replaced."
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "LionClip $version" \
              --generate-notes
          fi

      - name: Upload assets and publish release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" \
            release-files/lionclip_*_amd64.deb \
            release-files/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
