name: Rust

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libadwaita-1-dev \
            libgtk-4-dev \
            libx11-dev \
            pkg-config

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Finalize Phase 4 restore semantics
        if: github.event_name == 'pull_request' && github.head_ref == 'gpt/issue-5-phase-4'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          image_store = Path('src/image_store.rs')
          text = image_store.read_text()
          text = text.replace(
              '.save_to_bufferv("jpeg", &["quality"], &["90"])',
              '.save_to_bufferv("jpeg", &[("quality", "90")])',
          )
          image_store.write_text(text)

          service = Path('src/clipboard/service.rs')
          text = service.read_text()
          old = '''        let clipboard = self.clipboard.clone();
              let suppression = self.suppression.clone();
              let content_hash = image.content_hash().to_owned();
              let mime_type = image.mime_type();

              glib::MainContext::default().spawn_local(async move {
                  let bytes = match gio::spawn_blocking(move || fs::read(path)).await {
                      Ok(Ok(bytes)) => bytes,
                      Ok(Err(_)) | Err(_) => {
                          eprintln!("lionclip: image restore failed stage=blob-read");
                          return;
                      }
                  };
                  let bytes = glib::Bytes::from_owned(bytes);
                  let provider = gdk::ContentProvider::for_bytes(mime_type.as_str(), &bytes);
                  suppression.borrow_mut().arm_image(&content_hash);
                  if clipboard.set_content(Some(&provider)).is_err() {
                      suppression.borrow_mut().cancel();
                      eprintln!("lionclip: image restore failed stage=clipboard-set");
                  }
              });'''
          new = '''        // Restoration must complete before the popup closes: otherwise a fast
              // Ctrl+V can still see the previous clipboard while an async file read is
              // pending. This reads only the bounded compressed blob (max 25 MiB); it
              // never decodes full-resolution pixels on the GTK thread.
              let bytes = match fs::read(path) {
                  Ok(bytes) => bytes,
                  Err(_) => {
                      eprintln!("lionclip: image restore failed stage=blob-read");
                      return;
                  }
              };
              let bytes = glib::Bytes::from_owned(bytes);
              let provider = gdk::ContentProvider::for_bytes(image.mime_type().as_str(), &bytes);
              self.suppression
                  .borrow_mut()
                  .arm_image(image.content_hash());
              if self.clipboard.set_content(Some(&provider)).is_err() {
                  self.suppression.borrow_mut().cancel();
                  eprintln!("lionclip: image restore failed stage=clipboard-set");
              }'''
          if old not in text:
              raise SystemExit('restore_image source did not match expected baseline')
          service.write_text(text.replace(old, new))
          PY
          cargo fmt
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/image_store.rs src/clipboard/service.rs
            git commit -m 'fix: complete image restore before popup closes'
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Build
        run: cargo build --all-features
