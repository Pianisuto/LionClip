[package]
name = "lionclip"
version = "0.1.0"
edition = "2024"
description = "A small native clipboard-history utility for Linux"
publish = false

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_4"] }
gdk4-x11 = "0.11.4"
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_10"] }
x11rb = { version = "0.14.0", features = ["randr"] }

[profile.release]
lto = "thin"
