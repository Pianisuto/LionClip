[package]
name = "lionclip"
version = "0.1.0"
edition = "2024"
description = "A small native clipboard-history utility for Linux"
license = "MIT"
publish = false

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_4"] }
gdk4-x11 = "0.11.4"
glib-unix = "0.22.8"
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_10"] }
libc = "0.2.189"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
x11rb = { version = "0.14.0", features = ["randr", "xtest"] }

[profile.release]
lto = "thin"
# Debug symbols are 13% of the binary (3.38 MB -> 2.93 MB) and are of no use in
# an installed package; keeping them out costs no build time.
strip = "symbols"
